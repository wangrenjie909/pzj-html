<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎮 冒险岛 · 游戏大厅</title>
    <style>
        body {
            background: linear-gradient(to bottom, #aee6ff, #e8f7ff);
            color: #333;
            font-family: "Microsoft YaHei", sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ff8c00;
            font-size: 54px;
            margin-top: 55px;
            text-shadow: 2px 2px 0 #fff;
        }
        .welcome {
            font-size: 21px;
            color: #4a90d9;
            margin-bottom: 30px;
        }
        .lobby {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            padding: 10px 20px 40px;
        }
        .card {
            display: block;
            text-decoration: none;
            color: #333;
            background: #fff;
            width: 260px;
            padding: 30px 24px;
            border-radius: 24px;
            border: 4px solid #ffd43b;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.2);
        }
        .card .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
        }
        .card h2 {
            margin: 6px 0;
            color: #ff8c00;
        }
        .card p {
            font-size: 15px;
            color: #777;
            margin: 8px 0 0;
            line-height: 1.6;
        }
        .card .go {
            display: inline-block;
            margin-top: 16px;
            padding: 9px 22px;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
        }
        .card.game .go { background: #ff8c00; }
        .card.surv .go { background: #4dd0e1; }
        .card.npc .go { background: #da77f2; }
        /* ===== 冒险纪录面板 ===== */
        .records {
            display: inline-block;
            background: #fff;
            border: 4px solid #ffd43b;
            border-radius: 24px;
            padding: 18px 44px;
            margin: 6px auto 26px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            text-align: left;
        }
        .records h2 { margin: 0 0 10px; color: #ff8c00; font-size: 22px; text-align: center; }
        .rec-item { font-size: 17px; color: #555; padding: 4px 0; }
        .rec-item b { color: #e8590c; }
        .rec-tip { font-size: 13px; color: #999; margin-top: 8px; text-align: center; }
        .sign {
            margin-top: 10px;
            color: #888;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>
    <h1>🎮 冒险岛 · 游戏大厅</h1>
    <p class="welcome">欢迎来到冒险岛！选一个游戏开始玩吧～</p>

    <!-- 游戏入口 -->
    <div class="lobby">
        <a class="card game" href="page2.html">
            <span class="icon">🎲</span>
            <h2>冒险小游戏</h2>
            <p>掷骰子前进、开宝箱抽奖、打小怪赢金币，还能升级冲排行榜！</p>
            <span class="go">▶ 进入游戏</span>
        </a>

        <a class="card surv" href="page3.html">
            <span class="icon">⛏️</span>
            <h2>像素生存世界</h2>
            <p>立体方块大陆！挖矿收集资源，注意饥饿和生命，熬过黑夜！</p>
            <span class="go">▶ 进入游戏</span>
        </a>

        <a class="card npc" href="npc.html">
            <span class="icon">🧙</span>
            <h2>NPC 图鉴</h2>
            <p>认识冒险岛的朋友们：老村长、剑士、精灵、女巫……还能和他们说话！</p>
            <span class="go">▶ 认识他们</span>
        </a>
    </div>

    <!-- 冒险纪录（本机保存） -->
    <div class="records">
        <h2>🏆 我的冒险纪录</h2>
        <div class="rec-item">🎲 冒险小游戏最高纪录：<b id="recHiscore">0</b> 冒险币</div>
        <div class="rec-item">⛏️ 像素生存世界星星：<b id="recStars">0</b> 颗 ⭐</div>
        <div class="rec-tip">纪录存在本机浏览器里，玩游戏时会自动更新～</div>
    </div>

    <p class="sign">—— 冒险家1号 ——</p>

    <script>
        // 读取两个游戏的纪录并显示在大厅
        var recH = Number(localStorage.getItem("adventure_hiscore") || 0);
        var recS = Number(localStorage.getItem("survival_stars") || 0);
        document.getElementById("recHiscore").textContent = recH;
        document.getElementById("recStars").textContent = recS;
    </script>
</body>
</html>
